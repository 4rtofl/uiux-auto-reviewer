name: UI/UX auto reviewer
description: Reviews the UI/UX of a pull request with Claude and posts a scored check run and comment.
inputs:
  github-token:
    description: Token that posts the check run and the comment (the GitHub App's installation token).
    required: true
  anthropic-api-key:
    description: Claude API key.
    required: true
  config:
    description: Path of the settings file in the reviewed repository.
    default: .github/uiux-review.json
  model:
    description: Claude model.
    default: claude-opus-5-5
  dry-run:
    description: "true: write the review to the log and the job summary only, without posting."
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.ts"
      env:
        UIUX_GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        UIUX_CONFIG: ${{ inputs.config }}
        UIUX_MODEL: ${{ inputs.model }}
        UIUX_DRY_RUN: ${{ inputs.dry-run }}
