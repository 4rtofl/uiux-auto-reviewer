# Copy to .github/workflows/uiux-review.yml in the repository to review.
name: UI/UX review

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: uiux-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait for "ready for review"; the uiux-review label runs it again on demand.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'uiux-review')
    uses: 4rtofl/uiux-auto-reviewer/.github/workflows/review.yml@main
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-id: ${{ secrets.UIUX_APP_ID }}
      app-private-key: ${{ secrets.UIUX_APP_PRIVATE_KEY }}
