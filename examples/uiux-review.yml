# Copy to .github/workflows/uiux-review.yml in the repository to review.
name: UI/UX review

on:
  pull_request:
    # synchronize: a new head needs its own check; when no reviewed file changed, the last result is carried over
    # without calling Claude.
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: read
  id-token: write # Workload Identity Federation for the Claude API

concurrency:
  group: uiux-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait for "ready for review"; the uiux-review label runs it again on demand.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'uiux-review')
    uses: 4rtofl/uiux-auto-reviewer/.github/workflows/review.yml@main
    with:
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    secrets:
      # Only without Workload Identity Federation; leave the secret unset otherwise.
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-id: ${{ secrets.UIUX_APP_ID }}
      app-private-key: ${{ secrets.UIUX_APP_PRIVATE_KEY }}
