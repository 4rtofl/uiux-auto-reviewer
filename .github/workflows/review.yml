# The reusable workflow the reviewed repositories call (see README.md). It skips quietly when the credentials are
# missing, as they are for pull requests from forks.
name: UI/UX review

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .github/uiux-review.json
      model:
        type: string
        default: claude-opus-5-5
      # Workload Identity Federation (no Claude API key). These IDs are not secret; pass them from Actions variables.
      anthropic-federation-rule-id:
        type: string
        default: ""
      anthropic-organization-id:
        type: string
        default: ""
      anthropic-service-account-id:
        type: string
        default: ""
      anthropic-workspace-id:
        type: string
        default: ""
    secrets:
      anthropic-api-key:
        required: false
      app-id:
        required: false
      app-private-key:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # the GitHub OIDC token that Workload Identity Federation exchanges
    steps:
      - id: secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
          APP_ID: ${{ secrets.app-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ] && { [ -n "$FEDERATION_RULE_ID" ] || [ -n "$ANTHROPIC_API_KEY" ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The credentials for the UI/UX review are not available here (a pull request from a fork?); skipping."
          fi
      - id: token
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - if: steps.secrets.outputs.ok == 'true'
        uses: 4rtofl/uiux-auto-reviewer@main
        with:
          github-token: ${{ steps.token.outputs.token }}
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          anthropic-federation-rule-id: ${{ inputs.anthropic-federation-rule-id }}
          anthropic-organization-id: ${{ inputs.anthropic-organization-id }}
          anthropic-service-account-id: ${{ inputs.anthropic-service-account-id }}
          anthropic-workspace-id: ${{ inputs.anthropic-workspace-id }}
          config: ${{ inputs.config }}
          model: ${{ inputs.model }}
